<!DOCTYPE html>
<!--
  Golem - Chat Interface Template

  Changes from the parent project (which could write to /config):
  - Removed the diff viewer modal (#diffModal): with write access removed
    the agent never proposes changes, so there is nothing to diff or
    approve. This removes the modal markup, the approve/reject/cancel
    buttons and their onclick handlers (closeDiffModal,
    approvePendingChanges, rejectPendingChanges).
  - Removed the diff2html and diff CDN includes: they were loaded solely
    to render approval diffs.
  - Version badge updated to 0.4.1 to match the add-on version.

  Retained unchanged:
  - The chat container, input area and token counter (same element ids
    used by app.js and websocket-chat.js).
  - The marked.js CDN include (markdown rendering of assistant replies).
  - The script load order and the WebSocket override of sendMessage,
    which avoids the Home Assistant Ingress SSE buffering problem.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golem</title>
    <link rel="stylesheet" href="static/css/styles.css">
    <!-- marked.js: markdown rendering for assistant messages -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header: title, import/export buttons, version badge -->
        <header>
            <h1><img src="static/images/icon.png" width="64" height="64"/> The Golem</h1>
            <div class="header-actions">
                <!-- Import a previously exported conversation (JSON) -->
                <button id="importBtn" class="btn btn-icon" title="Import Conversation">📥</button>
                <!-- Export the current conversation as a JSON file -->
                <button id="exportBtn" class="btn btn-icon" title="Export Conversation">📤</button>
                <span class="version-badge"> 0.4.1 </span>
            </div>
            <!-- Hidden file input driven by the import button -->
            <input type="file" id="importFileInput" accept=".json" style="display: none;">
        </header>

        <main>
            <!-- Chat Interface -->
            <div class="chat-container">
                <!-- Message stream: user, assistant, system and tool cards
                     are appended here dynamically by app.js -->
                <div id="chatMessages" class="chat-messages">
                    <!-- Messages will be added here dynamically -->
                </div>

                <!-- Input Area -->
                <div class="chat-input-area">
                    <textarea
                        id="messageInput"
                        class="chat-input"
                        placeholder="Ask me anything about your Home Assistant configuration..."
                        rows="3"
                    ></textarea>
                    <button id="sendBtn" class="btn btn-primary">Send</button>
                </div>

            </div>
        </main>

        <!-- Footer: branding and the cumulative token usage counter,
             populated by updateTokenCounter() in app.js -->
        <footer>
            <p>Golem - read-only documentation agent for Home Assistant</p>
            <div id="tokenCounter" class="footer-token-stats" style="display: none;">
                <span class="token-counter-icon">📊</span>
                <span class="token-counter-breakdown">
                    <span class="token-counter-input" id="tokenCounterInput" title="Input tokens">↓0</span>
                    <span class="token-counter-output" id="tokenCounterOutput" title="Output tokens">↑0</span>
                    <span class="token-counter-cached" id="tokenCounterCached" title="Cached tokens" style="display: none;">💾0</span>
                </span>
            </div>
        </footer>
    </div>

    <!-- WebSocket chat module: must load first, as app.js depends on the
         override contract, and app.js defines the rendering helpers the
         WebSocket module calls. -->
    <script src="static/js/websocket-chat.js"></script>
    <script src="static/js/app.js"></script>
    <script>
        // Use WebSocket instead of SSE to avoid Ingress buffering.
        // Replace the stub sendMessage in app.js with the WebSocket
        // implementation exported by websocket-chat.js.
        if (typeof sendMessageWebSocket !== 'undefined') {
            console.log('Using WebSocket mode for real-time streaming');
            const originalSendMessage = sendMessage;
            sendMessage = sendMessageWebSocket;
        }
    </script>
</body>
</html>
